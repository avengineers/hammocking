[project]
name = "hammocking"
version = "1.0.0"
description = "Create mocks for c-code automatically"
authors = [{ name = "Avengineers", email = "karsten.guenther@kamg.de" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10,<3.14"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["py-app-dev>=2.7,<3", "libclang>=18.0,<19", "jinja2>=3.1.2,<4"]

[project.urls]
Repository = "https://github.com/avengineers/hammocking"
Documentation = "https://hammocking.readthedocs.io"
"Bug Tracker" = "https://github.com/avengineers/hammocking/issues"
"Changelog" = "https://github.com/avengineers/hammocking/blob/develop/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=7.1.2,<8",
    "pytest-cov>=4.0,<5",
    "black>=23.1.0,<24",
    "pre-commit>=3.1.1,<4",
    "ruff>=0.5,<1",
    "requests>=2.26.0,<3",
    "flake8",
    "pipenv",
    "pypeline-runner>=1.3,<2",
    "python-semantic-release>=9.16.1,<10",
    "sphinx>=7.3,<8",
    "sphinx-rtd-theme>=2.0,<3",
    "sphinxcontrib-mermaid>=0.9,<1",
    "sphinx-needs>=6.3,<7",
    "sphinx-test-reports>=1.0,<2",
    "sphinx-rtd-size>=0.2,<1",
    "sphinxcontrib-datatemplates>=0.11,<1",
    "sphinxcontrib-plantuml>=0.29,<1",
    "sphinx-copybutton>=0.5,<1",
    "sphinx-new-tab-link>=0.4,<1",
    "myst-parser>=0.16",
    "mlx-traceability>=10.0,<11",
    "sphinx-book-theme>=1.1,<2",
    "sphinx-design>=0.5,<1",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = [
    "src/hammocking/__init__.py:__version__",
    "docs/conf.py:release",
]
build_command = """
pip install uv
uv lock
git add uv.lock
uv build
"""

[tool.semantic_release.changelog]
exclude_commit_patterns = [
    '''chore(?:\([^)]*?\))?: .+''',
    '''ci(?:\([^)]*?\))?: .+''',
    '''refactor(?:\([^)]*?\))?: .+''',
    '''style(?:\([^)]*?\))?: .+''',
    '''test(?:\([^)]*?\))?: .+''',
    '''build\((?!deps\): .+)''',
    '''Merged? .*''',
    '''Initial [Cc]ommit.*''',         # codespell:ignore
]

[tool.semantic_release.changelog.environment]
keep_trailing_newline = true

[tool.semantic_release.branches.main]
match = "develop"

[tool.semantic_release.branches.noop]
match = "(?!develop$)"
prerelease = true

[tool.pytest.ini_options]
addopts = " -vv --capture=tee-sys --junitxml=build/test-report.xml --cov=hammocking --cov-report=term-missing:skip-covered --cov-config=pyproject.toml"
pythonpath = ["src", "tests"]
testpaths = ["tests"]
junit_logging = "all"
markers = [
    "integration: mark a test as an integration test",
    "unit: mark a test as a unit test",
]

[tool.coverage.run]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "@overload",
    "if TYPE_CHECKING",
    "raise NotImplementedError",
    'if __name__ == "__main__":',
]

[tool.ruff]
target-version = "py310"
line-length = 220
lint.ignore = [
    "D203", # 1 blank line required before class docstring
    "D212", # Multi-line docstring summary should start at the first line
    "D100", # Missing docstring in public module
    "D101", # Missing docstring in public class
    "D102", # Missing docstring in public method
    "D103", # Missing docstring in public function
    "D104", # Missing docstring in public package
    "D107", # Missing docstring in `__init__`
    "D401", # First line of docstring should be in imperative mood
    "S603", # subprocess calls with shell=True
]
lint.select = [
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "S",   # flake8-bandit
    "F",   # pyflake
    "E",   # pycodestyle
    "W",   # pycodestyle
    "UP",  # pyupgrade
    "I",   # isort
    "RUF", # ruff specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["D100", "D101", "D102", "D103", "D104", "S101"]
"setup.py" = ["D100"]
"conftest.py" = ["D100"]
"docs/conf.py" = ["D100"]

[tool.ruff.lint.isort]
known-first-party = ["hammocking", "tests"]

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
mypy_path = "src/"
no_implicit_optional = true
show_error_codes = true
warn_unreachable = true
warn_unused_ignores = true
exclude = ['docs/.*', 'setup.py']

[[tool.mypy.overrides]]
module = "tests.*"
allow_untyped_defs = true

[[tool.mypy.overrides]]
module = "docs.*"
ignore_errors = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hammocking"]
